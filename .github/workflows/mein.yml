name: Build RT5370

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies and LLVM 18
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev python3 unzip wget zstd \
            lsb-release software-properties-common gnupg

          LLVM_SH_URL=$(echo "aHR0cHM6Ly9hcHQubGx2bS5vcmcvbGx2bS5zaA==" | base64 -d)
          wget -qO /tmp/llvm.sh "$LLVM_SH_URL"
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18

          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-readelf; do
            sudo ln -sf "/usr/bin/${tool}-18" "/usr/local/bin/${tool}"
          done

      - name: Prepare kernel sources and config
        run: |
          set -euo pipefail
          mkdir -p "$HOME/work" "$HOME/mod/modules" "$HOME/mod/system/vendor/firmware" "$HOME/mod/META-INF/com/google/android"

          KERNEL_URL=$(echo "aHR0cHM6Ly9hbmRyb2lkLmdvb2dsZXNvdXJjZS5jb20va2VybmVsL2NvbW1vbg==" | base64 -d)
          git clone --depth=1 -b android15-6.6-2026-04 "$KERNEL_URL" "$HOME/work/kernel"

          cd "$HOME/work/kernel"
          cp "$GITHUB_WORKSPACE/defconfig.txt" .config

          ./scripts/config --disable LOCALVERSION_AUTO
          ./scripts/config --set-str LOCALVERSION "-android15-8-ge56cf6b09cca-ab1551674-4k"
          ./scripts/config -e CFI_CLANG

          ./scripts/config \
            -e NETDEVICES \
            -e WLAN \
            -e WLAN_VENDOR_RALINK \
            -e USB_SUPPORT \
            -e USB \
            -e NEW_LEDS \
            -e LEDS_CLASS \
            -e CRC_CCITT \
            -e CRYPTO_ARC4 \
            -e CRYPTO_LIB_ARC4

          ./scripts/config \
            -m RT2X00 \
            -m RT2X00_LIB \
            -m RT2X00_LIB_USB \
            -m RT2800_LIB \
            -m RT2800USB \
            -e RT2800USB_RT53XX

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig modules_prepare

          SYMVERS_URL=$(echo "aHR0cHM6Ly9jaS5hbmRyb2lkLmNvbS9idWlsZHMvc3VibWl0dGVkLzE1NTExNjc0L2tlcm5lbF9hYXJjaDY0L2xhdGVzdC9yYXcvTW9kdWxlLnN5bXZlcnM=" | base64 -d)
          wget -qO Module.symvers "$SYMVERS_URL"

      - name: Build RT2X00 / RT2800USB modules and pack KSU zip
        run: |
          set -euo pipefail
          cd "$HOME/work/kernel"

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 M=drivers/net/wireless/ralink/rt2x00

          find drivers/net/wireless/ralink/rt2x00 -name "*.ko" -exec cp -v {} "$HOME/mod/modules/" \;

          FW_URL=$(echo "aHR0cHM6Ly9naXQua2VybmVsLm9yZy9wdWIvc2NtL2xpbnV4L2tlcm5lb
